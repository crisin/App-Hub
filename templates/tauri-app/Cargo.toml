[workspace]
resolver = "2"
# src-tauri is the thin shell; crates/* hold the real logic and know nothing about Tauri
members = ["src-tauri", "crates/*"]
# coding-agent worktrees (App Hub) are separate checkouts, never workspace members
exclude = [".worktrees"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.dev]
# fast incremental builds for the shell, optimized dependencies
incremental = true

[profile.dev.package."*"]
opt-level = 2
